name: Build Sahrab AI APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip and Build
        run: |
          ls -la
          echo "--- Unzipping ---"
          unzip -o SahrabAI_Android_*.zip || unzip -o *.zip
          echo "--- Finding gradlew ---"
          find . -name "gradlew" -type f
          GW=$(find . -name "gradlew" -type f | head -n 1)
          echo "Using $GW"
          cd $(dirname "$GW")
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahrab-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
