name: Build Sahrab AI APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip
        run: |
          echo "Files in repo:"
          ls -la
          echo "---Finding ZIP---"
          find . -maxdepth 2 -name "*.zip" -type f
          for z in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Unzipping $z"
            unzip -o "$z"
          done
          echo "---After unzip---"
          ls -la
          find . -name "gradlew"
      - name: Build APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
          echo "Found gradlew at: $GRADLEW"
          if [ -z "$GRADLEW" ]; then echo "No gradlew found!"; exit 1; fi
          cd $(dirname "$GRADLEW")
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahrab-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
