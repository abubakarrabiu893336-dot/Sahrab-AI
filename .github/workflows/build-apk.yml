name: Build Sahrab AI APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          ls -lh
          unzip -o SahrabAI_Android_Project.zip
          ls -lh
      - run: chmod +x gradlew || chmod +x $(find . -name gradlew | head -1) || true
      - run: ./gradlew assembleDebug || $(find . -name gradlew | head -1) assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sahrab-AI-APK
          path: "**/*.apk"
