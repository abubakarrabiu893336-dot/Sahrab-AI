name: Build Sahrab AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SahrabAI_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q SahrabAI_Android_Project.zip -d project
          echo "Project contents:"
          find project -maxdepth 3 -type f | head -100

      - name: Find project folder
        run: |
          ROOT=$(find project -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Prepare Android project
        run: |
          echo "android.useAndroidX=true" > "$PROJECT_ROOT/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_ROOT/gradle.properties"
          cat "$PROJECT_ROOT/gradle.properties"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahrab-AI-APK
          path: "${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk"
