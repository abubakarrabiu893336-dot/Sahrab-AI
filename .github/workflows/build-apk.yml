name: Build Sahrab AI APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: |
          ls -lh
          unzip -o "*.zip" || unzip -o SahrabAI_Android_Project.zip
          echo "---After unzip---"
          ls -lh
          find . -name "gradlew" -type f
      - name: Build APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          echo "Found: $GRADLEW_PATH"
          DIR=$(dirname $GRADLEW_PATH)
          cd $DIR
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sahrab-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
