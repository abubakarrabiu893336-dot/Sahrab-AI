name: Build Sahrab AI APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip and Find
        run: |
          unzip -o SahrabAI_Android_Project.zip
          echo "Files after unzip:"
          ls -R | head -n 50
      - name: Build APK
        run: |
          DIR=$(find . -name "gradlew" -type f | head -1 | xargs dirname)
          echo "Project in: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Sahrab-AI-APK
          path: "**/app-debug.apk"
