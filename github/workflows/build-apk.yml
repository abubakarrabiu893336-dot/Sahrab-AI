name: Build Sahrab AI APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip Project
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Unzipping $ZIP"
          unzip -o "$ZIP"
          ls -la
      - name: Build APK
        run: |
          GW=$(find . -name "gradlew" -type f | head -n 1)
          echo "Gradlew at $GW"
          cd $(dirname "$GW")
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sahrab-AI-APK
          path: "**/build/outputs/apk/debug/*.apk"
